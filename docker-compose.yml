# Produção (lido pelo Coolify). Domínio: https://novelo.helder.si
# Um único domínio: o nginx do `web` serve o SPA e encaminha /api para a `api`. Nenhuma porta é
# publicada: o Traefik do Coolify é a única entrada. Ver docs/engenharia/deploy.md.
services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    mem_limit: 256m
    cpus: 1
    pids_limit: 256
    environment:
      - SERVICE_FQDN_WEB_80
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # Limites de recursos: o VPS é partilhado com outros projetos; o solver ou um PDF não podem esgotá-lo.
    mem_limit: 1536m
    cpus: 2
    pids_limit: 512
    environment:
      - APP_ENV=production
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DATABASE_URL=postgresql+asyncpg://novelo:${SERVICE_PASSWORD_POSTGRES}@db:5432/novelo
      - DATA_DIR=/app/data/processed
      - SECRET_KEY=${SERVICE_PASSWORD_64_SECRETKEY}
      - APP_URL=https://${DOMAIN:-novelo.helder.si}
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-true}
      - QUICK_JOIN_ENABLED=${QUICK_JOIN_ENABLED:-true}
      - QUICK_JOIN_CODE=${QUICK_JOIN_CODE:-}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY:-}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
      - TURNSTILE_ENABLED=${TURNSTILE_ENABLED:-auto}
      - TURNSTILE_REQUIRED=${TURNSTILE_REQUIRED:-false}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-Novelo <novelo@heldergoncalves.io>}
      - EMAIL_SUPPORT=${EMAIL_SUPPORT:-novelo@heldergoncalves.io}
      - CORS_ORIGINS=["https://${DOMAIN:-novelo.helder.si}"]
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - LLM_MODEL_TEXT=${LLM_MODEL_TEXT:-openai/gpt-6-luna}
      - LLM_MODEL_VISION=${LLM_MODEL_VISION:-openai/gpt-6-luna}
      - EMAIL_TRANSPORT=${EMAIL_TRANSPORT:-auto}
      - MAGIC_LINK_EXPIRE_MINUTES=${MAGIC_LINK_EXPIRE_MINUTES:-15}
      - GUEST_AI_REQUESTS_PER_HOUR=${GUEST_AI_REQUESTS_PER_HOUR:-20}
      - GUEST_SOLVER_RUNS_PER_HOUR=${GUEST_SOLVER_RUNS_PER_HOUR:-10}
      - GUEST_AI_BUDGET_USD=${GUEST_AI_BUDGET_USD:-0.5}
      - LLM_MODEL_FALLBACK=${LLM_MODEL_FALLBACK:-}
      - LLM_MONTHLY_BUDGET_USD=${LLM_MONTHLY_BUDGET_USD:-30}
      - LLM_AUX_PROVIDER_SORT=${LLM_AUX_PROVIDER_SORT:-latency}
      - WEB_SEARCH_ENABLED=${WEB_SEARCH_ENABLED:-true}
      - WEB_SEARCH_MODE=${WEB_SEARCH_MODE:-tool}
      - WEB_SEARCH_ENGINE=${WEB_SEARCH_ENGINE:-auto}
      - WEB_SEARCH_MAX_RESULTS=${WEB_SEARCH_MAX_RESULTS:-5}
      - WEB_SEARCH_MAX_CALLS=${WEB_SEARCH_MAX_CALLS:-3}
      - WEB_SEARCH_MAX_COST_USD=${WEB_SEARCH_MAX_COST_USD:-0.05}
      - WEB_SEARCH_CONTEXT_SIZE=${WEB_SEARCH_CONTEXT_SIZE:-low}
      - WEB_SEARCH_TIMEOUT_S=${WEB_SEARCH_TIMEOUT_S:-25}
      - WEB_SEARCH_ALLOWED_DOMAINS=${WEB_SEARCH_ALLOWED_DOMAINS:-}
      - WEB_SEARCH_EXCLUDED_DOMAINS=${WEB_SEARCH_EXCLUDED_DOMAINS:-}
      - GUEST_WEB_SEARCH_ENABLED=${GUEST_WEB_SEARCH_ENABLED:-false}
      - WEB_FETCH_ENABLED=${WEB_FETCH_ENABLED:-true}
      - WEB_FETCH_ALLOWED_DOMAINS=${WEB_FETCH_ALLOWED_DOMAINS:-}
      - WEB_FETCH_BLOCKED_DOMAINS=${WEB_FETCH_BLOCKED_DOMAINS:-}
      - WEB_FETCH_MAX_CONTENT_TOKENS=${WEB_FETCH_MAX_CONTENT_TOKENS:-12000}
      - SERVER_TOOLS_DATETIME_ENABLED=${SERVER_TOOLS_DATETIME_ENABLED:-true}
      - SERVER_TOOLS_TIMEZONE=${SERVER_TOOLS_TIMEZONE:-Europe/Lisbon}
      - OPENROUTER_ZDR_ENFORCED=${OPENROUTER_ZDR_ENFORCED:-false}
      - GUEST_SIGNUPS_PER_HOUR=${GUEST_SIGNUPS_PER_HOUR:-200}
      - GUEST_AI_GLOBAL_BUDGET_USD=${GUEST_AI_GLOBAL_BUDGET_USD:-5}
      - INVITATION_EXPIRE_DAYS=${INVITATION_EXPIRE_DAYS:-7}
      - INVITATIONS_PER_HOUR=${INVITATIONS_PER_HOUR:-30}
      - IMPERSONATION_MINUTES=${IMPERSONATION_MINUTES:-30}
      # IP real do cliente: Cloudflare -> Traefik -> nginx -> API. Dois proxies privados à frente da API (nginx e
      # Traefik) e a Cloudflare tratada pelo cabeçalho CF-Connecting-IP. Ver docs/engenharia/ambiente.md.
      - TRUSTED_PROXY_HOPS=${TRUSTED_PROXY_HOPS:-2}
      - TRUST_CLOUDFLARE_HEADER=${TRUST_CLOUDFLARE_HEADER:-true}
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-1}
      - SOLVER_RUNS_PER_MINUTE=${SOLVER_RUNS_PER_MINUTE:-6}
      - SOLVER_MAX_CONCURRENCY=${SOLVER_MAX_CONCURRENCY:-2}
      - SOLVER_TIME_LIMIT_S=${SOLVER_TIME_LIMIT_S:-20}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    mem_limit: 512m
    cpus: 1
    pids_limit: 256
    environment:
      - POSTGRES_USER=novelo
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=novelo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novelo -d novelo"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
