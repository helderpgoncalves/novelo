# Cabeçalhos de segurança. Incluído em CADA location porque o add_header de um location anula os herdados do server.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), geolocation=(), microphone=(self), payment=()" always;
# CSP estrita, sem 'unsafe-eval' nem scripts inline. O worker do MapLibre vem do próprio domínio (assets/maplibre-gl-worker-*.mjs).
#   estilos: 'unsafe-inline' só em CSS (atributos style do React/MapLibre); mapa de base: CARTO (estilo, sprites, glyphs, tiles);
#   Turnstile: script e iframe da Cloudflare; Google Sign-In é uma navegação (redirecionamento), não carrega nada na página.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; worker-src 'self'; child-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.basemaps.cartocdn.com https://lh3.googleusercontent.com; font-src 'self'; connect-src 'self' https://basemaps.cartocdn.com https://*.basemaps.cartocdn.com https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; manifest-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
