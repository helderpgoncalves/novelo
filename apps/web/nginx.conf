# nginx dentro do contentor web (porta 80): serve o SPA e encaminha /api para a API.
# Um só domínio (novelo.helder.si): sem CORS e sem URLs da API no bundle.
# Só as páginas públicas se indexam: inicial (/, /pt/, /en/), Privacidade, Termos, passaportes de lote e os ativos.
# Entrada, registo e toda a app levam noindex (cabeçalho, além da meta nas rotas). Valor vazio = cabeçalho omitido.
map $request_uri $robots_tag {
    default "noindex, nofollow";
    ~^/(?:(?:pt|en)/?)?(?:\?|$) "";
    ~^/(?:pt|en)/(?:privacy|terms|passport/[^/?]+)/?(?:\?|$) "";
    ~^/(?:assets|landing|og|icons|fonts|screenshots|email)/ "";
    ~\.(?:txt|xml|ico|svg|png|webmanifest|js|css|woff2)(?:\?|$) "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 8m;  # fotos da triagem (máx. 5 MB cada)

    include /etc/nginx/snippets/security-headers.conf;

    # Compressão: a imagem oficial do nginx não traz brotli; gzip dinâmico para texto. AVIF, WebP, PNG e WOFF2 já vêm
    # comprimidos e ficam de fora.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/xml application/json application/manifest+json application/javascript text/javascript image/svg+xml;

    # API a reiniciar (redeploy): em vez da página HTML do nginx devolve JSON tipado, que o web mostra como
    # "a atualizar, volta já" e reintenta sozinho (ver lib/api-config.ts).
    error_page 502 503 504 = @api_down;
    location @api_down {
        default_type application/json;
        add_header Retry-After 5 always;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
        return 503 '{"code":"service_unavailable","message":"API restarting"}';
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;  # otimização e IA podem demorar
    }

    # Copiloto em streaming (SSE): sem buffering nem compressão, ligação longa. A API também envia X-Accel-Buffering: no.
    location ~ ^/api/v1/copilot/(stream|threads/[^/]+/regenerate)$ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Anexos do copiloto: até 5 ficheiros de 10 MB.
    location = /api/v1/copilot/attachments {
        client_max_body_size 55m;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location /health {
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        # Ficheiro em falta em /assets/ é 404 a sério (nunca o index.html): foi assim que o worker do mapa falhou calado.
        try_files $uri =404;
    }

    # Ativos de nome estável (sem hash no nome): 30 dias, revalidam em segundo plano. Fotografias dither, imagens de
    # partilha, ícones e fontes.
    location ~ ^/(landing|og|fonts|icons|screenshots|email)/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Service worker e manifest: SEMPRE revalidados. `max-age=0` explícito, porque a Cloudflare aplica o "Browser Cache
    # TTL" (4 h por omissão) a respostas sem max-age e isso atrasaria as atualizações da PWA.
    location ~ ^/(sw\.js|workbox-[^/]+\.js|registerSW\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache, max-age=0, must-revalidate";
        add_header X-Robots-Tag $robots_tag always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # "/" não redireciona por Accept-Language: um 302 a rastreadores dava-lhes uma página diferente da x-default e a
    # pré-visualizações (WhatsApp, LinkedIn) nenhuma. Serve a landing pré-renderizada em português (a mesma do
    # x-default, /pt/); o cliente escolhe o idioma (preferência guardada, depois o do navegador) e muda o URL.
    location = / {
        try_files /pt/index.html /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag $robots_tag always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Páginas pré-renderizadas (<rota>/index.html, ver scripts/prerender.mjs) antes do fallback do SPA; HTML sempre revalidado.
    location / {
        try_files $uri $uri/index.html /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag $robots_tag always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
