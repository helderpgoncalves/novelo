<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#2E6B57" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1815" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Novelo" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Novelo: recolha seletiva de têxteis de Guimarães, desenhada ao menor custo." />
    <title>Novelo</title>
  </head>
  <body>
    <script>
      // Aplica o tema guardado antes da primeira pintura (sem flash).
      (function () {
        try {
          var stored = localStorage.getItem('novelo-theme');
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
