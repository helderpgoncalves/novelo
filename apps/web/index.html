<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover + env(safe-area-inset-*) no CSS; interactive-widget faz o teclado encolher o layout (Android). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Cor da barra do sistema = fundo do topo da app (linho / tinta). lib/theme.tsx atualiza ao trocar de tema. -->
    <meta name="theme-color" content="#F4F1EA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1815" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Novelo" />
    <!-- "default": barra de estado opaca que o iOS pinta (texto escuro/claro) segundo o modo do sistema, por isso
         nunca fica ilegível. black-translucent sobreporia a app à barra com texto SEMPRE branco, ilegível no tema claro. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Novelo: recolha seletiva de têxteis de Guimarães, desenhada ao menor custo." />
    <title>Novelo</title>
    <style>
      html { background: #f4f1ea; }
      html.dark { background: #0f1815; }
      .boot-splash { display: flex; min-height: 100dvh; align-items: center; justify-content: center; }
      .boot-splash-mark { animation: boot-pulse 1.6s ease-in-out infinite; }
      @keyframes boot-pulse { 0%,100% { opacity: .55; transform: scale(.96); } 50% { opacity: 1; transform: scale(1); } }
      @media (prefers-reduced-motion: reduce) { .boot-splash-mark { animation: none; } }
    </style>
  </head>
  <body>
    <script>
      // Aplica o tema guardado antes da primeira pintura (sem flash).
      (function () {
        try {
          var stored = localStorage.getItem('novelo-theme');
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
          if (stored) {
            var metas = document.querySelectorAll('meta[name="theme-color"]');
            for (var i = 0; i < metas.length; i++) metas[i].setAttribute('content', dark ? '#0F1815' : '#F4F1EA');
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"><div class="boot-splash" role="status" aria-label="A carregar"><svg class="boot-splash-mark" viewBox="-512 -512 1024 1024" width="56" height="56" aria-hidden="true"><path d="M134.99 -160.87A210 210 0 1 1 -117.43 -174.10" fill="none" stroke="#A9C2B7" stroke-width="56" stroke-linecap="round"/><path d="M192.84 -229.81A300 300 0 1 1 -167.76 -248.71" fill="none" stroke="#2E6B57" stroke-width="56" stroke-linecap="round"/><path d="M250.69 -298.76A390 390 0 1 1 -218.09 -323.32" fill="none" stroke="#C4A06A" stroke-width="56" stroke-linecap="round"/><circle r="92" fill="#14211D"/><circle r="38" fill="#F4F1EA"/></svg></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
