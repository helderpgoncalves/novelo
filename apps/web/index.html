<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover + env(safe-area-inset-*) no CSS; interactive-widget faz o teclado encolher o layout (Android). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" sizes="48x48" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Cor da barra do sistema = fundo do topo da app (linho / tinta). lib/theme.tsx atualiza ao trocar de tema. -->
    <meta name="theme-color" content="#F4F1EA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1815" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Novelo" />
    <!-- "default": barra de estado opaca que o iOS pinta (texto escuro/claro) segundo o modo do sistema, por isso
         nunca fica ilegível. black-translucent sobreporia a app à barra com texto SEMPRE branco, ilegível no tema claro. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="Novelo desenha a rede de recolha seletiva de têxteis de Guimarães ao menor custo: orçamento e meta entram, saem cenários comparáveis em euros, toneladas e €/t."
    />
    <!-- Esta casca serve a app e o desenvolvimento: sem canonical, hreflang nem og:url (diriam "/" para todas as rotas).
         As páginas públicas têm o seu <head> próprio, escrito no build por scripts/prerender.mjs (dist/{pt,en}/...). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Novelo" />
    <meta property="og:title" content="Novelo: recolha de têxteis de Guimarães ao menor custo" />
    <meta property="og:description" content="Novelo mostra onde e como recolher têxteis em Guimarães, e quanto custa cada tonelada desviada do aterro." />
    <meta property="og:image" content="https://novelo.helder.si/og/novelo-partilha-landing-pt.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="Novelo: recolha de têxteis, desenhada ao menor custo. Pôr do sol sobre Guimarães em pontos dourados e verdes." />
    <meta property="og:locale" content="pt_PT" />
    <meta property="og:locale:alternate" content="en_GB" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://novelo.helder.si/og/novelo-partilha-landing-pt.png" />
    <title>Novelo: recolha de têxteis de Guimarães ao menor custo</title>
    <style>
      html { background: #f4f1ea; }
      html.dark { background: #0f1815; }
      .boot-splash { display: flex; min-height: 100dvh; align-items: center; justify-content: center; }
      /* Spinner (repete as regras de .brand-arc em src/styles.css: manter iguais). */
      .brand-arc { animation-timing-function: cubic-bezier(0.45, 0.05, 0.55, 0.95); animation-iteration-count: infinite; animation-delay: calc(var(--spin-t, 0ms) * -1); }
      .brand-arc-1 { animation-name: brand-arc-cw; animation-duration: 1.7s; }
      .brand-arc-2 { animation-name: brand-arc-ccw; animation-duration: 2.6s; }
      .brand-arc-3 { animation-name: brand-arc-cw; animation-duration: 4.2s; }
      .brand-dot { animation: brand-dot 1.8s ease-in-out infinite; animation-delay: calc(var(--spin-t, 0ms) * -1); }
      @keyframes brand-arc-cw { to { transform: rotate(360deg); } }
      @keyframes brand-arc-ccw { to { transform: rotate(-360deg); } }
      @keyframes brand-dot { 0%,100% { transform: scale(1); } 50% { transform: scale(0.88); } }
      @keyframes brand-spin-pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .brand-arc, .brand-dot { animation: none; }
        .brand-spin { animation: brand-spin-pulse 1.6s ease-in-out infinite; }
      }
      /* cores do símbolo (geradas por scripts/brand/build_assets.py) */
      /* brand:splash-css:start */
      .boot-splash-mark .a1 { stroke: #A9C2B7; } .boot-splash-mark .a2 { stroke: #2E6B57; } .boot-splash-mark .a3 { stroke: #C4A06A; } .boot-splash-mark .dot { fill: #14211D; }
      html.dark .boot-splash-mark .a1 { stroke: #3E6658; } html.dark .boot-splash-mark .a2 { stroke: #7FB39C; } html.dark .boot-splash-mark .dot { fill: #F4F1EA; }
      /* brand:splash-css:end */
      @keyframes boot-pulse { 0%,100% { opacity: .55; transform: scale(.96); } 50% { opacity: 1; transform: scale(1); } }
      @media (prefers-reduced-motion: reduce) { .boot-splash-mark { animation: none; } }
    </style>
  </head>
  <body>
    <script src="/theme-init.js"></script>
    <div id="root"><div class="boot-splash" role="status" aria-label="A carregar"><!-- brand:splash:start --><svg class="boot-splash-mark brand-spin" viewBox="-420 -420 840 840" width="56" height="56" aria-hidden="true"><path class="a1 brand-arc brand-arc-1" d="M134.99 -160.87A210 210 0 1 1 -117.43 -174.10" fill="none" stroke-width="56" stroke-linecap="round"/><path class="a2 brand-arc brand-arc-2" d="M192.84 -229.81A300 300 0 1 1 -167.76 -248.71" fill="none" stroke-width="56" stroke-linecap="round"/><path class="a3 brand-arc brand-arc-3" d="M250.69 -298.76A390 390 0 1 1 -218.09 -323.32" fill="none" stroke-width="56" stroke-linecap="round"/><path class="dot brand-dot" d="M0 -92.0A92.0 92.0 0 1 1 0 92.0A92.0 92.0 0 1 1 0 -92.0ZM0 -38.0A38.0 38.0 0 1 0 0 38.0A38.0 38.0 0 1 0 0 -38.0Z" fill-rule="evenodd"/></svg><!-- brand:splash:end --></div></div>
    <!-- Sem JavaScript (e para quem só lê o HTML, como verificadores): nome, descrição e ligações legais. -->
    <noscript>
      <main style="max-width: 40rem; margin: 0 auto; padding: 2rem 1rem; font-family: system-ui, sans-serif; line-height: 1.5">
        <h1>Novelo</h1>
        <p>Recolha seletiva de têxteis de Guimarães, desenhada ao menor custo. Novelo needs JavaScript to run.</p>
        <p>
          <a href="/pt/login">Entrar</a> · <a href="/pt/privacy">Política de Privacidade</a> ·
          <a href="/pt/terms">Termos de Utilização</a> · <a href="/en/privacy">Privacy Policy</a> ·
          <a href="/en/terms">Terms of Use</a>
        </p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
