[project]
name = "novelo-api"
version = "0.1.0"
description = "API do Novelo: otimização da recolha de têxteis de Guimarães."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pyproj>=3.8.0",
  "pydantic[email]>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "psycopg2-binary>=2.9",
  "httpx>=0.28",
  "ortools>=9.11",
  "orjson>=3.10",
  "pyjwt>=2.15.1",
  "argon2-cffi>=25.1.0",
  "segno>=1.6.6",
  "python-multipart>=0.0.32",
  "weasyprint>=70.0",
  "jinja2>=3.1.6",
  "pillow>=11.0",
  "pypdf>=6.2",
  "openpyxl>=3.1.5",
  "pyyaml>=6.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "mypy>=1.13",
  "pypdf>=6.21.1",
  "openpyxl>=3.1.5",
  "shapely>=2.0",  # só para testar scripts/etl/municipal_containers.py (a imagem de produção não os instala)
  "pyshp>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/novelo"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501", "PLR0915"]
"src/novelo/features/copilot/*" = ["E501"]  # prompts, textos e tabelas de dados em linhas longas
"tests/api/test_copilot*" = ["E501"]
"tests/api/test_memory*" = ["E501"]
"tests/sse.py" = ["E501"]
"tests/unit/test_charts.py" = ["E501"]
"tests/unit/test_stream_adapter.py" = ["E501"]
"src/novelo/ai/eval_*.py" = ["E501"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF", "PL"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "RUF001", "RUF002", "RUF003"]

[[tool.mypy.overrides]]
module = ["ortools.*", "weasyprint.*", "openpyxl.*", "yaml.*"]
ignore_missing_imports = true

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
