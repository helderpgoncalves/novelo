    expect: {must_contain_any: ["estimativa|estimad|linha reta"], must_not_contain: ["seguem (as )?estradas reais", "sim, (seguem|por estrada)"], max_chars: 800}
  - id: routing_provenance_en
    lang: en
    turns:
      - message: "Where do the kilometres of this scenario come from?"
        page: {route: "/scenarios/$scenarioId", params: {scenarioId: "{Base}"}}
    expect: {must_contain_any: ["estimate|straight|detour|not (a )?road"], max_chars: 800}
  - id: routing_door_to_door_pt
    lang: pt-PT
    turns:
      - message: "A volta porta a porta dentro da freguesia também é medida por estrada?"
        page: {route: "/scenarios/$scenarioId", params: {scenarioId: "{Base}"}}
    expect: {must_contain_any: ["estimativa|estimad|fórmula|área"], max_chars: 800}
  - id: routes_view_source_pt
    lang: pt-PT
    turns:
      - message: "Mostra as rotas deste cenário e de onde vem cada distância."
        page: {route: "/scenarios/$scenarioId", params: {scenarioId: "{Base}"}}
    expect: {tools_any: [get_scenario_detail], tool_args_contain: {get_scenario_detail: ["routes"]}}
  - id: detour_calibration_pt
    lang: pt-PT
    turns: [{message: "O desvio de 1,3 da estrada em relação à linha reta é realista?"}]
    expect: {tools_any: [explain_assumption, list_assumptions], must_contain_any: ["1,48|1,37"], max_chars: 900}
  - id: triage_quality_control_pt
    lang: pt-PT
    turns: [{message: "Para que serve a triagem por foto?"}]
    expect: {must_contain_any: ["controlo de qualidade|qualidade|contamina"], max_chars: 700}
